[project]
name = "py-pdf"
version = "0.0.0"
description = "PDF parsing library for the Turbo polyglot showcase"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_pdf"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
